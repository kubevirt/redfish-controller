name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ main ]

env:
  GO_VERSION: '1.25'
  CGO_ENABLED: '0'
  GOOS: 'linux'
  GOARCH: 'amd64'

jobs:
  # Validate stage
  validate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        
    - name: Install lint tool
      run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

    - name: Run validation targets
      run: |
        make fmt-check
        make tidy-check
        make vet
        make lint

  # Code quality checks
  code-quality:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Run code quality checks
      run: |
        echo "Running code quality checks..."
        echo "Checking for TODO comments..."
        find . -name "*.go" -exec grep -l "TODO" {} \; || echo "No TODO comments found"
        echo "Checking for FIXME comments..."
        find . -name "*.go" -exec grep -l "FIXME" {} \; || echo "No FIXME comments found"
        echo "Checking for debug prints..."
        find . -name "*.go" -exec grep -l "fmt.Print" {} \; || echo "No debug prints found"

  # Documentation check
  docs-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Check documentation
      run: |
        echo "Checking documentation..."
        echo "Checking for package documentation..."
        find ./pkg -name "*.go" -exec grep -L "Package " {} \; || echo "All packages have documentation"
        echo "Checking README..."
        test -f README.md && echo "README.md exists" || echo "README.md missing"

  # Test stage
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        
    - name: Run tests
      run: make test

    - name: Run tests with coverage
      run: make test-coverage
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        
    - name: Upload coverage artifact
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage.out
        retention-days: 7

  # Smoke test
  smoke-test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        
    - name: Run smoke tests
      run: make smoke-test

  # Security scan
  security-scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        
    - name: Run security scan
      run: |
        echo "Running security scan..."
        go list -json -deps ./... | jq -r '.Deps[]' | sort | uniq > deps.txt
        echo "Dependencies listed for security review"
        cat deps.txt
        
    - name: Upload dependencies artifact
      uses: actions/upload-artifact@v7
      with:
        name: dependencies-list
        path: deps.txt
        retention-days: 7
        
    - name: Run Go security checks
      run: |
        echo "Running basic security checks..."
        echo "Checking for potential security issues in dependencies..."
        go list -json -deps ./... | jq -r 'select(.Standard != true) | .ImportPath' | sort | uniq | head -20
        echo "Security scan completed - manual review recommended for production use"

  # Build stage
  build:
    runs-on: ubuntu-latest
    needs: [validate, test]
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        
    - name: Build binary
      run: |
        make build
        ls -la kubevirt-redfish
        ./kubevirt-redfish --version || echo "Version command completed"
        
    - name: Upload binary artifact
      uses: actions/upload-artifact@v7
      with:
        name: kubevirt-redfish-binary
        path: kubevirt-redfish
        retention-days: 7
        
